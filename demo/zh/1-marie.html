<!DOCTYPE html>
<html lang="zh-CN">

<title>告解 · 玛丽</title>
<style>
:root{
  --ink:#150616; --panel:#1e0e1c; --panel2:#2a1526;
  --brown:#452313; --gold:#dba850; --cream:#f8eedf;
  --lilac:#9e8da9; --plum:#53266e; --wine:#83211f;
  --txt:#d8cbc4; --dim:#8a7a80; --line:#3a2434;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--txt);
  font-family:"Songti SC","SimSun","Source Han Serif SC",Georgia,serif;
  display:flex;flex-direction:column;font-size:15.5px;line-height:1.95;
  -webkit-font-smoothing:antialiased;user-select:none;touch-action:manipulation}
.px{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;letter-spacing:.1em}

#bar{flex:0 0 auto;display:flex;align-items:center;gap:9px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#loc{font-size:9.5px;color:var(--dim);flex:1}
#loc b{color:var(--gold);font-weight:400}
.btn{font-size:9.5px;padding:7px 11px;background:var(--panel2);color:var(--gold);
  border:1px solid var(--line);cursor:pointer;font-family:ui-monospace,Menlo,monospace}
.btn:active{background:var(--gold);color:var(--ink)}
.btn .cnt{color:var(--dim)}

#stage{flex:1 1 auto;position:relative;min-height:0;overflow:hidden}
#art{display:block;width:100%;height:100%}
#flash{position:absolute;inset:0;pointer-events:none;background:#fffdf2;opacity:0}

#dlg{flex:0 0 auto;position:relative;border-top:1px solid var(--line);background:var(--panel);
  padding:0 17px calc(env(safe-area-inset-bottom) + 15px);
  min-height:186px;display:flex;flex-direction:column;cursor:pointer}
#who{align-self:flex-start;transform:translateY(-11px);font-size:10.5px;padding:4px 12px;
  background:var(--panel2);border:1px solid var(--line);color:var(--gold);
  letter-spacing:.18em;visibility:hidden;font-family:ui-monospace,Menlo,monospace}
#who.on{visibility:visible}
#body{flex:1;font-size:15.5px;min-height:88px;padding-top:3px}
#body.speech{color:var(--cream)}
#body.think{color:var(--lilac);letter-spacing:.08em;padding-left:13px;border-left:2px solid var(--plum)}
#next{align-self:flex-end;color:var(--gold);font-size:10px;opacity:0;
  font-family:ui-monospace,Menlo,monospace;animation:blink 1.1s steps(2,end) infinite}
#next.on{opacity:1}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.12}}

#choices{display:none;flex-direction:column;gap:8px;padding-bottom:4px}
#choices.on{display:flex}
.opt{width:100%;text-align:left;padding:13px 14px;font-size:15px;background:var(--panel2);
  color:var(--txt);border:1px solid var(--line);border-left:4px solid var(--plum);
  font-family:inherit;cursor:pointer}
.opt:active{background:var(--gold);color:var(--ink);border-left-color:var(--ink)}

#docs{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;
  background:rgba(15,6,16,.97);padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 18px)}
#docs.on{display:flex}
#docHd{font-size:10px;color:var(--gold);letter-spacing:.2em;margin-bottom:4px;font-family:ui-monospace,Menlo,monospace}
#docSub{font-size:12px;color:var(--dim);margin-bottom:15px}
#listView{flex:1;display:flex;flex-direction:column;min-height:0}
#listView.off{display:none}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
#detailView{flex:1;display:none;flex-direction:column;overflow-y:auto}
#detailView.on{display:flex}
.doc{padding:13px 14px;background:var(--panel);border:1px solid var(--line);
  cursor:pointer;text-align:left;font-family:inherit;color:var(--txt);width:100%}
.doc:active{border-color:var(--gold)}
.doc .no{font-size:9px;color:var(--gold);display:block;margin-bottom:5px;font-family:ui-monospace,Menlo,monospace}
.doc .nm{font-size:15px;display:block;margin-bottom:4px}
.doc .ds{font-size:12px;color:var(--dim);line-height:1.7}
.dNo{font-size:9px;color:var(--gold);letter-spacing:.18em;font-family:ui-monospace,Menlo,monospace}
.dNm{font-size:19px;color:var(--cream);margin:7px 0 9px}
.dDs{font-size:13px;color:var(--dim);margin-bottom:17px;line-height:1.75}
.fields{border:1px solid var(--line);background:var(--panel)}
.fRow{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid #2a1526;font-size:13px}
.fRow:last-child{border-bottom:none}
.fK{color:var(--dim);flex:0 0 82px;font-size:12px}
.fV{color:var(--txt);flex:1}
.fV.blank{color:#4b3a44}
.memo{margin-top:15px;padding:12px 13px;border-left:3px solid var(--gold);
  background:rgba(219,168,80,.07);font-size:13px;color:#dcc9a8;line-height:1.78}
.acts{display:flex;flex-direction:column;gap:8px;margin:19px 0 4px}
.act{padding:13px;font-size:14px;font-family:inherit;border:1px solid var(--line);
  background:var(--panel2);color:var(--txt);cursor:pointer}
.act.primary{border-color:var(--gold);color:var(--gold)}
.act:active{background:var(--gold);color:var(--ink)}
#docClose{margin-top:13px;padding:13px;font-size:12px;background:var(--panel2);
  color:var(--dim);border:1px solid var(--line);font-family:inherit;cursor:pointer}

#fin{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:24px;background:rgba(15,6,16,.97);padding:32px}
#fin.on{display:flex}
#finT{font-size:9.5px;color:var(--dim);letter-spacing:.3em;font-family:ui-monospace,Menlo,monospace}
#finS{font-size:19px;color:var(--gold);text-align:center;line-height:1.85}
#again{padding:13px 30px;font-size:11px;letter-spacing:.26em;background:transparent;
  color:var(--gold);border:1px solid var(--gold);font-family:ui-monospace,Menlo,monospace;cursor:pointer}
#again:active{background:var(--gold);color:var(--ink)}
@media (prefers-reduced-motion:reduce){#next{animation:none}#next.on{opacity:1}}
</style>

<style>
.finActs{display:flex;flex-direction:column;align-items:center;gap:14px}
a.finNext{padding:13px 26px;font-size:12px;letter-spacing:.16em;text-decoration:none;
  font-family:ui-monospace,Menlo,Consolas,monospace;border:1px solid currentColor;opacity:.95}
a.finExit{font-size:12px;text-decoration:underline;text-underline-offset:4px;opacity:.7;color:inherit}
a.exitX{font:10px ui-monospace,Menlo,Consolas,monospace;padding:6px 9px;border:1px solid currentColor;
  color:inherit;text-decoration:none;opacity:.55;flex:none}
a.exitX:active{opacity:1}
</style>
</head>

/* ---------- 舞台 ---------- */
const cv=document.getElementById('art'),cx=cv.getContext('2d');
const stage=document.getElementById('stage');
let W=0,H=0,ready=false,sil=null;
let cur='back',prev=null,fade=1,t0=performance.now();
let spill=false,drops=[],shake=0;

const SKY=['#f2e8d0','#ecdfc2','#dfd3b0'];
const GRASS=['#93986a','#7c8455','#636d42','#4a5230'];
const LILY=[[.12,0],[.22,.06],[.38,.02],[.66,.05],[.80,0],[.90,.04]];
const DEW=[[.16,.02],[.30,.05],[.52,0],[.72,.06],[.86,.02]];

IMG.onload=()=>{
  const c=document.createElement('canvas');
  c.width=IMG.width;c.height=IMG.height;
  const g=c.getContext('2d');
  g.drawImage(IMG,0,0);
  g.globalCompositeOperation='source-atop';
  g.fillStyle='#1d0f18';g.fillRect(0,0,c.width,c.height);
  sil=c;ready=true;
};
function setSprite(k){if(k===cur)return;prev=cur;cur=k;fade=0;if(k==='turn')shake=460;}
function resize(){
  const r=stage.getBoundingClientRect(),d=devicePixelRatio||1;
  cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0);
  W=r.width;H=r.height;
}
addEventListener('resize',resize);

function figure(state,alpha){
  if(!ready)return;
  const src=(state==='back')?sil:IMG;
  const h=H*(state==='smile'?0.94:state==='turn'?0.88:0.84);
  const w=h*IMG.width/IMG.height;
  let x=(W-w)/2, y=H-h;
  if(shake>0)x+=Math.sin(shake*0.09)*shake*0.012;
  cx.save();
  cx.globalAlpha=alpha;
  if(state==='back'){cx.translate(W,0);cx.scale(-1,1);x=W-x-w;}
  cx.drawImage(src,x,y,w,h);
  cx.restore();
}

function draw(now){
  const dt=now-t0;t0=now;
  if(fade<1)fade=Math.min(1,fade+dt/520);
  if(shake>0)shake=Math.max(0,shake-dt);

  const horizon=H*0.56;
  cx.clearRect(0,0,W,H);
  for(let i=0;i<SKY.length;i++){cx.fillStyle=SKY[i];cx.fillRect(0,i*horizon/SKY.length,W,horizon/SKY.length+1);}
  for(let i=0;i<GRASS.length;i++){cx.fillStyle=GRASS[i];cx.fillRect(0,horizon+i*(H-horizon)/GRASS.length,W,(H-horizon)/GRASS.length+1);}

  const u=Math.max(4,W/90);
  LILY.forEach(([fx,fo])=>{
    const x=fx*W,y=horizon+fo*H;
    cx.fillStyle='#3e4a2a';cx.fillRect(x,y,u*0.5,u*5);
    cx.fillStyle='#f4efe0';
    cx.beginPath();cx.arc(x-u*.7,y+u*1.4,u*.62,0,7);cx.fill();
    cx.beginPath();cx.arc(x+u*.9,y+u*2.7,u*.55,0,7);cx.fill();
    cx.beginPath();cx.arc(x-u*.6,y+u*4.0,u*.5,0,7);cx.fill();
  });
  DEW.forEach(([fx,fo],i)=>{
    cx.globalAlpha=.3+.7*Math.abs(Math.sin(now/760+i*1.7));
    cx.fillStyle='#ffffff';
    cx.beginPath();cx.arc(fx*W,horizon+fo*H-u,u*.32,0,7);cx.fill();
  });
  cx.globalAlpha=1;

  if(spill){
    const cxp=W*0.20,cyp=horizon+H*0.20;
    cx.fillStyle='#7c8a6a';
    cx.fillRect(cxp,cyp,u*3.2,u*1.9);
    cx.fillRect(cxp+u*3,cyp+u*.4,u*1.6,u*.7);
    if(Math.random()<.6)drops.push({x:cxp+u*4.4,y:cyp+u*.6,
      vx:1.1+Math.random()*1.5,vy:-1.3-Math.random(),l:1});
    cx.fillStyle='#c8dce8';
    drops.forEach(d=>{d.x+=d.vx*u*.5;d.y+=d.vy*u*.5;d.vy+=.2;d.l-=.016;
      if(d.l>0){cx.globalAlpha=d.l;cx.beginPath();cx.arc(d.x,d.y,u*.24,0,7);cx.fill();}});
    cx.globalAlpha=1;drops=drops.filter(d=>d.l>0);
  }

  if(prev&&fade<1)figure(prev,1-fade);
  figure(cur,fade);

  const g=cx.createRadialGradient(W/2,H*.42,Math.min(W,H)*.36,W/2,H*.42,Math.max(W,H)*.78);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(40,26,20,.34)');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  requestAnimationFrame(draw);
}
function glare(){
  const f=document.getElementById('flash');
  f.style.transition='none';f.style.opacity='.88';
  requestAnimationFrame(()=>{f.style.transition='opacity 1.2s ease-out';f.style.opacity='0';});
}

/* ---------- BGM ----------
   iOS 会忽略 HTMLMediaElement.volume，且对 data:audio/mp4 支持很差。
   所以优先用 Web Audio 解码播放（GainNode 在 iOS 上是有效的），
   解码失败再退回 <audio> 元素。两条路都失败时按钮会显示 ✕。 */
const bgmEl=document.getElementById('bgm'),bgmBtn=document.getElementById('bgmBtn');
let bgmOn=true,mode=null,AC=null,gain=null,src=null,buf=null,decoding=false;
const VOL=0.5;

function label(t){bgmBtn.textContent=t;}

async function startBgm(){
  if(mode||decoding||!bgmOn)return;
  decoding=true;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')await AC.resume();
    if(!buf){
      const res=await fetch(bgmEl.src);
      const ab=await res.arrayBuffer();
      buf=await new Promise((ok,no)=>{
        const p=AC.decodeAudioData(ab,ok,no);
        if(p&&p.then)p.then(ok,no);
      });
    }
    gain=AC.createGain();gain.gain.value=0;gain.connect(AC.destination);
    src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    src.connect(gain);src.start();
    gain.gain.linearRampToValueAtTime(VOL,AC.currentTime+2.2);
    mode='wa';label('♪ 开');
  }catch(e){
    try{
      await bgmEl.play();
      bgmEl.volume=VOL;      // 桌面有效，iOS 忽略（则为原音量）
      mode='el';label('♪ 开');
    }catch(e2){ label('♪ ✕'); }
  }
  decoding=false;
}

bgmBtn.onclick=async e=>{
  e.stopPropagation();
  if(!mode){bgmOn=true;await startBgm();return;}
  bgmOn=!bgmOn;
  if(mode==='wa'){
    gain.gain.cancelScheduledValues(AC.currentTime);
    gain.gain.linearRampToValueAtTime(bgmOn?VOL:0,AC.currentTime+0.35);
    if(bgmOn&&AC.state==='suspended')AC.resume();
  }else{ bgmOn?bgmEl.play():bgmEl.pause(); }
  label(bgmOn?'♪ 开':'♪ 关');
};
label('♪ 播放');

/* ---------- 引擎 ---------- */
const $=i=>document.getElementById(i);
const body=$('body'),who=$('who'),nextI=$('next'),chBox=$('choices');
let queue=[],typing=false,tm=null,full='',waiting=false,pend=null;

function run(l){queue=S[l].slice();step();}
function step(){
  if(!queue.length)return;
  const nd=queue.shift();
  if(nd.sp){setSprite(nd.sp);setTimeout(step,560);return;}
  if(nd.fx==='glare'){glare();step();return;}
  if(nd.fx==='spill'){spill=true;step();return;}
  if(nd.fx==='stop'){spill=false;step();return;}
  if(nd.goto){run(nd.goto);return;}
  if(nd.fin){finish(nd.fin);return;}
  if(nd.choice){showChoice(nd.choice);return;}
  if(nd.present){pend=nd.present;openDocs(true);return;}
  chBox.classList.remove('on');body.className='';
  if(nd.c){who.textContent=nd.c;who.classList.add('on');body.classList.add('speech');say(nd.s);}
  else if(nd.th){who.classList.remove('on');body.classList.add('think');say(nd.th);}
  else{who.classList.remove('on');say(nd.n);}
}
function say(t){
  full=t;body.textContent='';typing=true;waiting=false;nextI.classList.remove('on');
  let i=0;clearInterval(tm);
  tm=setInterval(()=>{body.textContent=full.slice(0,++i);
    if(i>=full.length){clearInterval(tm);typing=false;waiting=true;nextI.classList.add('on');}},36);
}
function advance(){
  startBgm();
  if($('docs').classList.contains('on')||$('fin').classList.contains('on'))return;
  if(typing){clearInterval(tm);body.textContent=full;typing=false;waiting=true;nextI.classList.add('on');return;}
  if(waiting){waiting=false;nextI.classList.remove('on');step();}
}
let lastTap=0;
function onTap(e){
  const t=e.target;if(!t||!t.closest)return;
  if(t.closest('#docs')||t.closest('#fin')||t.closest('#choices')||t.closest('#bar'))return;
  const n=Date.now();if(n-lastTap<260)return;lastTap=n;advance();
}
if(window.PointerEvent)document.addEventListener('pointerup',onTap);
else{document.addEventListener('touchend',onTap,{passive:true});document.addEventListener('click',onTap);}

function showChoice(opts){
  waiting=false;nextI.classList.remove('on');chBox.innerHTML='';
  opts.forEach(o=>{const b=document.createElement('button');
    b.className='opt';b.textContent=o.label;
    b.onclick=ev=>{ev.stopPropagation();startBgm();chBox.classList.remove('on');run(o.goto);};
    chBox.appendChild(b);});
  chBox.classList.add('on');
}

let selecting=false;
const listView=$('listView'),detailView=$('detailView');
function openDocs(sel){
  selecting=!!sel;
  $('docSub').textContent=sel?'选择一份情报出示。':'目前掌握的情报。轻点可查看详情。';
  closeDetail();
  const L=$('list');L.innerHTML='';
  EVIDENCE.forEach(e=>{const b=document.createElement('button');b.className='doc';
    b.innerHTML='<span class="no">'+e.no+'</span><span class="nm">'+e.nm+'</span><span class="ds">'+e.ds+'</span>';
    b.onclick=()=>openDetail(e);L.appendChild(b);});
  $('docClose').textContent=sel?'再想想':'收起';
  $('docs').classList.add('on');
}
function openDetail(e){
  let h='<div class="dNo">'+e.no+'</div><div class="dNm">'+e.nm+'</div><div class="dDs">'+e.ds+'</div><div class="fields">';
  e.rows.forEach(r=>{const blank=/^（.*）$/.test(r[1])?' blank':'';
    h+='<div class="fRow"><div class="fK">'+r[0]+'</div><div class="fV'+blank+'">'+r[1]+'</div></div>';});
  h+='</div>';
  if(e.memo)h+='<div class="memo">'+e.memo+'</div>';
  h+='<div class="acts">';
  if(selecting)h+='<button class="act primary" data-act="show">出示这份情报</button>';
  h+='<button class="act" data-act="back">返回列表</button></div>';
  detailView.innerHTML=h;
  detailView.querySelectorAll('.act').forEach(b=>b.onclick=()=>{b.dataset.act==='show'?present(e):closeDetail();});
  detailView.scrollTop=0;listView.classList.add('off');detailView.classList.add('on');
}
function closeDetail(){listView.classList.remove('off');detailView.classList.remove('on');}
$('docBtn').onclick=()=>{if(!$('fin').classList.contains('on')){startBgm();openDocs(false);}};
$('docClose').onclick=()=>{$('docs').classList.remove('on');closeDetail();
  if(selecting){queue.unshift({present:pend});step();}};
function present(e){
  $('docs').classList.remove('on');closeDetail();
  if(e.id===pend.ok){const g=pend.goto;pend=null;run(g);}
  else{queue.unshift({present:pend});
    if(pend.badLine)queue.unshift({c:'玛丽',s:pend.badLine});
    else queue.unshift({n:pend.bad});
    step();}
}
function finish(s){
  nextI.classList.remove('on');$('finS').textContent=s;$('fin').classList.add('on');
  if(mode==='wa'&&gain){gain.gain.cancelScheduledValues(AC.currentTime);
    gain.gain.linearRampToValueAtTime(0,AC.currentTime+1.6);}
  else if(mode==='el'){let v=bgmEl.volume;const t=setInterval(()=>{v=Math.max(0,v-.03);bgmEl.volume=v;if(v<=0)clearInterval(t);},80);}
}
$('again').onclick=()=>location.reload();

$('docCnt').textContent=String(EVIDENCE.length).padStart(2,'0');
resize();requestAnimationFrame(draw);run('start');
</script>
