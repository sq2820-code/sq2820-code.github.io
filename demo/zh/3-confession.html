<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0908">
<title>告解 · 鼠疫</title>
<style>
:root{
  color-scheme:dark;
  --void:#0a0908; --panel:#131110; --panel2:#1b1817;
  --bone:#e4ded2; --bone-d:#9a9287; --ash:#5e574e; --rule:#332e28;
  --heart:#a8767c;
  --s1:#7f96a8; --s2:#b08a76; --s3:#98996f;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#0a0908}
html,body{height:100%;min-height:100vh;overflow:hidden}
@supports (height:100dvh){html,body{min-height:100dvh}}
body{background:#0a0908;background:var(--void);color:var(--bone-d);forced-color-adjust:none;
  font-family:"Songti SC","SimSun",Georgia,serif;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;user-select:none;touch-action:manipulation}
#backdrop{position:fixed;inset:0;background:#0a0908;z-index:-1;pointer-events:none}
.px{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;letter-spacing:.12em}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--rule);
  box-shadow:0 2px 0 #000;padding:calc(env(safe-area-inset-top) + 9px) 14px 9px;
  display:flex;align-items:center;gap:13px;z-index:6}
#rpWrap{flex:1}
.lbl{font-size:8px;color:var(--ash);margin-bottom:6px}
#rpRow{display:flex;align-items:center;gap:8px}
#rpBar{flex:1;height:8px;border:1px solid var(--rule);position:relative;overflow:hidden;
  background:repeating-linear-gradient(135deg,#171513 0 3px,#0d0c0b 3px 6px)}
#rpFill{position:absolute;inset:0;right:auto;background:linear-gradient(180deg,#efe9dd,#b8b0a3);transition:width .5s}
#rpNum{font-size:11px;color:var(--bone-d);width:28px;text-align:right}
#heartBox{width:40px;text-align:center}
#heartBox.full svg{animation:thump 1.5s ease-in-out infinite}
@keyframes thump{0%,100%{transform:none}6%{transform:translate(.6px,-.6px) scale(1.06)}
  12%{transform:translate(-.5px,.4px) scale(1)}18%{transform:translate(.4px,0) scale(1.03)}26%{transform:none}}
#afNum{font-size:9px;color:var(--ash);margin-top:2px}

/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;position:relative;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%}
#scrim{position:absolute;left:0;right:0;top:0;height:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(7,6,5,.94) 0%,rgba(7,6,5,.90) 62%,rgba(7,6,5,0) 100%);
  transition:height .55s ease}
#textWrap{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:20px 20px 84px;scrollbar-width:none}
#textWrap::-webkit-scrollbar{display:none}
#head{text-align:center;margin-bottom:18px}
#head .rl{display:flex;align-items:center;gap:10px;color:#2e2822;font-size:9px}
#head .rl::before,#head .rl::after{content:"";flex:1;height:1px;background:#2e2822}
#who{font-size:9px;color:#544d44;margin-top:8px}

.line{font-size:17px;line-height:2.16;margin-bottom:1.1em;text-align:justify;
  color:#8d8474;transition:color 1s ease;
  text-shadow:0 1px 3px rgba(0,0,0,.96),0 0 12px rgba(0,0,0,.85);animation:rise .5s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.line.now{color:#f4eee2}
.line.done{color:#7a7264}
.line.gift{border-left:2px solid var(--heart);padding-left:12px}
.line.lit{color:#fbf7ee}
.line.gone{color:#221f1b;font-style:italic}
.line.sweep{animation:sweep .7s ease-out}
@keyframes sweep{0%{background:rgba(228,222,210,.26)}100%{background:transparent}}
body.parse .line:not(.gone):not(.lit){cursor:pointer}
.tok{display:inline}
.line.lit .tok{cursor:pointer}
.line.lit .tok.t1{color:var(--s1);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.line.lit .tok.t2{color:var(--s2);font-weight:700}
.line.lit .tok.t3{color:var(--s3);font-style:italic}
.line.lit .tok.used{color:#3d3830!important;text-decoration-color:#3d3830;cursor:default}

#tip{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:10px;
  color:#7d7466;letter-spacing:.24em;pointer-events:none;
  font-family:ui-monospace,Menlo,monospace;animation:blink 1.2s steps(2,end) infinite}
#tip.off{display:none}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.14}}
#ff{position:absolute;right:14px;bottom:12px;font-size:10px;padding:9px 12px;
  background:rgba(19,17,16,.9);border:1px solid var(--rule);color:var(--bone-d);
  font-family:ui-monospace,Menlo,monospace;letter-spacing:.14em;cursor:pointer;z-index:4}
#ff.on{background:var(--bone);color:#000;border-color:var(--bone)}
#ff.hide{display:none}
#cap{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:11px;
  color:#8a8071;letter-spacing:.2em;pointer-events:none;opacity:0;transition:opacity .5s;
  font-family:ui-monospace,Menlo,monospace;padding:0 20px}
#cap.on{opacity:1}

/* ---------- 解析台 ---------- */
#deck{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--rule);
  box-shadow:0 -2px 0 #000;padding:11px 12px calc(env(safe-area-inset-bottom) + 11px);
  transform:translateY(101%);max-height:0;transition:transform .5s cubic-bezier(.2,.7,.3,1),max-height .5s}
#deck.on{transform:none;max-height:60vh}
#wheels{display:flex;gap:8px;margin-bottom:10px}
.wBox{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.wCap{font-size:8.5px;letter-spacing:.16em;text-align:center;color:var(--ash);font-family:ui-monospace,Menlo,monospace}
.wFrame{position:relative;height:98px;overflow:hidden;border:1px solid #000;
  box-shadow:inset 0 0 0 1px #453e34,0 1px 0 #000;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.028) 0 1px,transparent 1px 5px,
      rgba(0,0,0,.22) 5px 6px,transparent 6px 13px),
    linear-gradient(180deg,#080706 0%,#2e2822 16%,#4b4238 50%,#2e2822 84%,#080706 100%)}
.wScroll{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;position:relative;z-index:2;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wScroll::-webkit-scrollbar{display:none}
.wPad{height:32px}
.wItem{height:32px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;
  font-size:14px;color:rgba(228,222,210,.26);padding:0 3px;text-align:center;line-height:1.15;
  transition:color .2s;font-family:"Songti SC","SimSun",Georgia,serif}
.wBox[data-t="1"] .wItem{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.wBox[data-t="2"] .wItem{font-weight:700}
.wBox[data-t="3"] .wItem{font-style:italic}
.wBox[data-t="1"] .wItem.sel{color:var(--s1)}
.wBox[data-t="2"] .wItem.sel{color:var(--s2)}
.wBox[data-t="3"] .wItem.sel{color:var(--s3)}
.wItem.empty{text-decoration:none;font-weight:400;font-style:normal;color:rgba(228,222,210,.15)}
.wBand{position:absolute;left:0;right:0;top:32px;height:32px;pointer-events:none;z-index:3;
  border-top:1px solid rgba(240,234,222,.5);border-bottom:1px solid rgba(240,234,222,.5);
  box-shadow:inset 0 0 22px rgba(0,0,0,.55)}
.wGloss{position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(90deg,rgba(0,0,0,.55) 0%,rgba(255,255,255,.05) 38%,rgba(255,255,255,.07) 55%,rgba(0,0,0,.6) 100%)}
#acts{display:flex;gap:8px}
.actBtn{flex:1;padding:13px 6px;font-size:13px;letter-spacing:.18em;
  font-family:ui-monospace,Menlo,monospace;border:1px solid var(--rule);
  background:#0e0d0c;color:var(--ash);cursor:pointer;line-height:1.5}
.actBtn small{display:block;font-size:9px;letter-spacing:.06em;opacity:.7;margin-top:2px}
.actBtn.ready{color:var(--bone)}
#sayBtn.ready{border-color:var(--heart)}
#askBtn.ready{border-color:var(--bone-d)}
#sayBtn.ready:active{background:var(--heart);color:#000}
#askBtn.ready:active{background:var(--bone);color:#000}

/* ---------- 回应 ---------- */
#hush{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .5s;background:rgba(6,5,5,.5)}
#hush.on{opacity:1}
#hush span{font-size:26px;letter-spacing:.5em;color:var(--ash)}
#reply{position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(101%);
  transition:transform .34s cubic-bezier(.2,.7,.3,1);background:var(--panel2);
  border-top:1px solid var(--bone-d);box-shadow:0 -8px 40px rgba(0,0,0,.85);
  padding:19px 19px calc(env(safe-area-inset-bottom) + 20px);cursor:pointer}
#reply.on{transform:none}
#reply.warm{border-top-color:var(--heart)}
#rWho{font-size:9px;color:var(--ash);margin-bottom:11px;font-family:ui-monospace,Menlo,monospace;letter-spacing:.24em}
#rTxt{font-size:16.5px;line-height:2.02;color:var(--bone);min-height:60px}
#rMeta{margin-top:12px;font-size:10px;color:var(--ash);font-family:ui-monospace,Menlo,monospace}
#rNext{margin-top:8px;text-align:right;font-size:10px;color:var(--bone-d);
  font-family:ui-monospace,Menlo,monospace;animation:blink 1.1s steps(2,end) infinite}

/* ---------- 结算 ---------- */
#fin{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:20px;background:rgba(6,5,5,.975);padding:32px}
#fin.on{display:flex}
#finT{font-size:9px;color:var(--ash);font-family:ui-monospace,Menlo,monospace;letter-spacing:.3em}
#finS{font-size:20px;color:var(--bone);text-align:center;line-height:1.9}
#finD{font-size:13px;color:var(--ash);text-align:center;line-height:2;max-width:350px;white-space:pre-line}
#again{padding:13px 30px;font-size:11px;letter-spacing:.26em;background:transparent;color:var(--bone-d);
  border:1px solid var(--ash);font-family:ui-monospace,Menlo,monospace;cursor:pointer}
@media (prefers-reduced-motion:reduce){#tip,#rNext,#heartBox.full svg{animation:none}}
</style>

<style>
.finActs{display:flex;flex-direction:column;align-items:center;gap:14px}
a.finNext{padding:13px 26px;font-size:12px;letter-spacing:.16em;text-decoration:none;
  font-family:ui-monospace,Menlo,Consolas,monospace;border:1px solid currentColor;opacity:.95}
a.finExit{font-size:12px;text-decoration:underline;text-underline-offset:4px;opacity:.7;color:inherit}
a.exitX{font:10px ui-monospace,Menlo,Consolas,monospace;padding:6px 9px;border:1px solid currentColor;
  color:inherit;text-decoration:none;opacity:.55;flex:none}
a.exitX:active{opacity:1}
</style>
</head>
<body>
<div id="backdrop"></div>

<div id="hud">
  <div id="rpWrap">
    <div class="lbl px">阅读力</div>
    <div id="rpRow"><div id="rpBar"><div id="rpFill" style="width:66.7%"></div></div><div id="rpNum" class="px">100</div></div>
  </div>
  <a class="exit exitX" href="../../index.html#game-zh" style="color:var(--bone-d)">✕</a>
  <div id="heartBox">
    <svg width="26" height="24" viewBox="0 0 32 29">
      <defs><clipPath id="hclip"><rect id="hrect" x="0" y="29" width="32" height="29"/></clipPath>
      <path id="hpath" d="M16 28C16 28 2 19.4 2 10.4 2 5.2 5.9 2 9.9 2c2.7 0 5 1.5 6.1 3.6C17.1 3.5 19.4 2 22.1 2 26.1 2 30 5.2 30 10.4c0 9-14 17.6-14 17.6z"/></defs>
      <use href="#hpath" fill="#171412" stroke="#4a4038" stroke-width="1.6"/>
      <use href="#hpath" fill="var(--heart)" clip-path="url(#hclip)"/>
      <use href="#hpath" fill="none" stroke="#5c5048" stroke-width="1.2"/>
    </svg>
    <div id="afNum" class="px">20</div>
  </div>
</div>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="scrim"></div>
  <div id="textWrap">
    <div id="head"><div class="rl px">◆</div><div id="who" class="px">MDP-0?? ／ 鼠疫 ── 第一次告解</div></div>
    <div id="lines"></div>
  </div>
  <div id="cap" class="px"></div>
  <div id="tip" class="px">▼ 听下去</div>
  <button id="ff" class="px">快进 ▸▸</button>
</div>

<div id="deck">
  <div id="wheels">
    <div class="wBox" data-t="1"><div class="wCap">主</div>
      <div class="wFrame"><div class="wGloss"></div><div class="wScroll" data-t="1"></div><div class="wBand"></div></div></div>
    <div class="wBox" data-t="2"><div class="wCap">谓</div>
      <div class="wFrame"><div class="wGloss"></div><div class="wScroll" data-t="2"></div><div class="wBand"></div></div></div>
    <div class="wBox" data-t="3"><div class="wCap">宾</div>
      <div class="wFrame"><div class="wGloss"></div><div class="wScroll" data-t="3"></div><div class="wBand"></div></div></div>
  </div>
  <div id="acts">
    <button id="sayBtn" class="actBtn">复 述<small>不费力气</small></button>
    <button id="askBtn" class="actBtn">提 问<small>阅读力 −12</small></button>
  </div>
</div>

<div id="hush"><span>…………</span></div>
<div id="reply"><div id="rWho">鼠疫</div><div id="rTxt"></div><div id="rMeta"></div><div id="rNext">▼ TAP</div></div>
<div id="fin"><div id="finT">— 告解结束 —</div><div id="finS"></div><div id="finD"></div><div class="finActs"><button id="again">再来一次</button><a class="exit finExit" style="color:var(--bone-d)" href="../../index.html#game-zh">返回作品集</a></div></div>

<script>
const $=i=>document.getElementById(i);

/* ================== 画面参数（已锁定） ================== */
const GAP=52, BARW=8, BRI=70, BRSPD=50;
const TYPE_SLOW=62, TYPE_FAST=9;

/* ================== 数值 ================== */
const RP={start:100,max:150,light:5,relight:2,ask:12};
const AF={start:20,max:100,gift1:45,gift2:80,floor:10};

/* ================== 独白（区＝句） ================== */
const REGIONS=[
 {id:'a1',p:[['t','神父？咳咳…'],['k','you',1,'您'],['t','听得到吗？说实话，我真不习惯这样，一个人说话。']]},
 {id:'a2',p:[['t','自从上一任'],['k','priest',1,'神父'],['t','走了之后，已经很长时间'],['k','none',2,'没有'],['t','人来顶替他的位置了。']]},
 {id:'b1',p:[['t','真的过了很久，久到我已经记不太清，他究竟长什么样、叫什么'],['k','name',3,'名字'],['t','、又是因为什么离开的了。']]},
 {id:'b2',p:[['t','我甚至'],['k','doubt',2,'怀疑'],['t','，他可能从来就没'],['k','exist',2,'存在'],['t','过。']]},
 {id:'c1',p:[['t','还是来说说我自己吧。我本来没有名字。']]},
 {id:'c2',p:[['t','您肯定知道的吧，'],['k','rat',1,'老鼠'],['t','这种生物，不'],['k','need',2,'需要'],['t','名字，我们只需要充足的'],['k','food',3,'食物'],['t','和隐蔽的角落，就可以安度一生。']]},
 {id:'c3',p:[['k','human',1,'人类'],['t','那样叫我们，我是知道的，是想把我们当标本，当藏品，当作可以观赏、钻研、痛骂的对象。这些事，我知道，但我怎么也想不明白。']]},
 {id:'d1',p:[['t','哈哈，好好的告解，怎么倒变成控诉了。但要我说自己做了什么坏事，我实在想不出来。']]},
 {id:'d2',p:[['t','其实每天在'],['k','here',3,'这里'],['t','的生活，我觉得十分满足。毕竟从来不会饿肚子，也没有人拿着各种奇怪的武器攻击一只老鼠。']]},
 {id:'d3',p:[['t','您可不要笑话我，这里的生活，可比在'],['k','out',3,'外面'],['t','更'],['k','free',3,'自由'],['t','。']]}
];
const GIFT1=[
 {id:'e1',p:[['t','……您还愿意听？那我再说一件。上个礼拜，我在食堂门口'],['k','pick',2,'捡到'],['t','一枚'],['k','button',3,'扣子'],['t','。不是这里的人穿的那种。']]}
];
const GIFT2=[
 {id:'f1',p:[['t','神父，您下次来的时候，能不能走慢一点。不是催您。是您走过走廊的时候，声音太大了。'],['k','we',1,'我们'],['t','这边有几个还小，听见就躲起来，一整天不肯出来吃东西。']]}
];

const ASK=[
 {k:['we','need','here'],kind:'true',rp:50,af:20,
  txt:'……您用了这个词。\n是。我们需要这里。\n不是我。是我们。\n所以那天晚上，我们才不能不出去——有一部分在吃饭，有一部分在外面。'},
 {k:['rat','need','here'],kind:'break',rp:45,af:12,
  txt:'……需要。\n您是第一个这样问的。\n他们都问我想不想出去。没有人问过我，想不想留下。'},
 {k:['you','doubt','name'],kind:'egg',rp:28,af:8,
  txt:'……您也是这样。\n一个不肯说出名字的人，来听别人的名字。\n我们大概是同一种东西，神父。'},
 {k:['rat','exist','free'],kind:'egg',rp:28,af:8,
  txt:'自由。\n一只老鼠说自由，您不觉得可笑吗。\n可我在这里从来不会饿。外面才是不自由。'},
 {k:['human','need','name'],kind:'egg',rp:28,af:8,
  txt:'是啊。你们非要给什么都起个名字。\n起了名字，就好像那东西是你们的了。\n黑死病。您看，多好的名字。可我从来不叫这个。'},
 {k:['you','pick','button'],kind:'egg',rp:28,af:8,
  txt:'您捡到过吗。\n……不，是我捡到的。\n那颗扣子是黑的，上面有个十字。\n神父大人，您的袍子上，好像也少了一颗。'},
 {k:['priest','exist',null],kind:'flavor',rp:8,af:4,
  txt:'……\n我也想知道。\n我说过了，我怀疑他从来就没存在过。'},
 {k:['rat','none','name'],kind:'lead',rp:12,af:6,
  txt:'对。我们从来不需要名字。\n您就这么写吧，写「无名」。这样最省事。'}
];
const SAY={
 'rat|need|here':{af:10,txt:'……老鼠需要这里。\n您把它说出来了。\n我自己没敢这么说过。'},
 'we|need|here':{af:14,txt:'我们。\n对，我说了「我们」。\n您听见了。'},
 'you|doubt|name':{af:8,txt:'我怀疑名字。\n名字是别人给的。怀疑名字，就是怀疑给的人。'},
 'rat|exist|free':{af:8,txt:'老鼠存在自由。\n您说得比我好听。我只是说这里不饿。'},
 'human|need|name':{af:8,txt:'人类需要名字。\n……对。是你们需要，不是我们。\n这句话我一直想说，说不出来。'},
 'you|pick|button':{af:10,txt:'我捡到扣子。\n您替我说了。\n那我就当您已经知道了。'},
 'rat|none|name':{af:4,txt:'老鼠没有名字。\n对。您记着这句就好。'},
 'priest|exist|':{af:6,txt:'神父存在。\n……您这么说，我倒希望是真的。'}
};
const SAY_ANY={
 need:{af:4,txt:'需要。\n是啊，需要。\n这个词说出来的时候，人总要低一低头。'},
 doubt:{af:3,txt:'怀疑。\n您慢慢说。我不急。'},
 exist:{af:3,txt:'存在。\n这个词太大了。您愿意说，我就听着。'},
 none:{af:4,txt:'没有。\n没有的东西也能说出来，真好。'},
 pick:{af:4,txt:'捡到。\n地上的东西，捡起来就是自己的了。'},
 we:{af:6,txt:'……您跟着我说了这个词。\n很少有人跟着说。'}
};
const NEAR={obj:{af:-1,txt:'……不是那个。\n您差一点。'},
  subj:{af:-1,txt:'……您弄错了是谁。\n再想想。'},
  pred:{af:-1,txt:'……我没有那样做。\n可您为什么会往那边想呢。'}};
const MISS={af:-5,txt:'……我不明白您的意思。'};
/* 说过的话不再生效：同一句他只反应一次 */
const AGAIN_SAY=['……这句您刚才说过了。','嗯。还是这句。','您很喜欢这一句吗。',
                 '我听见了，第二遍。'];
const AGAIN_ASK=['这个我已经答过了，神父。','……同样的问题，我没有别的答案。',
                 '您再问一次，答案也不会变。'];
let againI=0;
const usedSay={},usedAsk={},usedPred={};

const FLIP={you:'我'};
const NOISE='▨▧▩▤▥▦░▒▚▞';

/* ================== 状态 ================== */
let phase='listen', idx=0, typing=false, tm=null, curEl=null, curReg=null, fullTxt='';
let fast=false;
let rp=RP.start, af=AF.start;
let lit=null, read={}, gone={}, taken={}, sel=['','',''];
let busy=false, done=false, metFlip=false;
let gotTrue=false, eggs=0, says=0, g1=false, g2=false, retracted=false, dreadLv=0;
const TOK={};
function idxTok(src){src.forEach(r=>r.p.forEach(x=>{if(x[0]==='k')TOK[x[1]]={t:x[2],w:x[3]};}));}
idxTok(REGIONS);idxTok(GIFT1);idxTok(GIFT2);
const shown=k=>FLIP[k]||TOK[k].w;
const ALL=()=>REGIONS.concat(GIFT1,GIFT2);
const plain=r=>r.p.map(x=>x[0]==='t'?x[1]:x[3]).join('');

/* ================== 剪影 ================== */
const cv=$('cv'),cx=cv.getContext('2d'),stage=$('stage');
let W=0,H=0,act='idle',lean=0,tilt=0,back=0,glow=0,t0=performance.now(),ph=0;
function resize(){const r=stage.getBoundingClientRect(),d=devicePixelRatio||1;
  cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;}
addEventListener('resize',resize);
function hood(c,s){c.beginPath();c.moveTo(-s,s);c.lineTo(-.72*s,.14*s);
  c.quadraticCurveTo(-.68*s,-.26*s,-.41*s,-.53*s);c.quadraticCurveTo(-.31*s,-.93*s,0,-s);
  c.quadraticCurveTo(.31*s,-.93*s,.41*s,-.53*s);c.quadraticCurveTo(.68*s,-.26*s,.72*s,.14*s);
  c.lineTo(s,s);c.closePath();}
function figure(depth,alpha,blur,dx,dy,rot,scale){
  const s=Math.min(W,H)*(.30+.20*(1-depth))*scale;
  cx.save();
  if(blur>0&&'filter' in cx)cx.filter='blur('+blur.toFixed(1)+'px)';
  cx.globalAlpha=alpha;cx.translate(W/2+dx,H*.94+dy);cx.rotate(rot);
  const l=(BRI/100)*(1-depth*.55);
  const g=cx.createLinearGradient(0,-s,0,s);
  g.addColorStop(0,'rgb('+Math.round(58*l+8)+','+Math.round(52*l+7)+','+Math.round(46*l+6)+')');
  g.addColorStop(1,'#0e0c0b');
  cx.fillStyle=g;hood(cx,s);cx.fill();
  cx.globalCompositeOperation='multiply';cx.fillStyle='rgba(0,0,0,.86)';
  cx.beginPath();cx.ellipse(0,-.46*s,.21*s,.27*s,0,0,7);cx.fill();
  cx.restore();
}
function draw(now){
  const dt=Math.min(50,now-t0);t0=now;ph+=dt/1000*(BRSPD/60)*.9;
  let tL=0,tT=0,tB=0,tG=0;
  if(act==='say')tL=.55;else if(act==='ask')tB=.42;else if(act==='dodge')tT=.16;
  else if(act==='hit'){tL=.95;tG=1;}else if(act==='retract')tB=1;
  lean+=(tL-lean)*.12;tilt+=(tT-tilt)*.12;back+=(tB-back)*.12;glow+=(tG-glow)*.12;
  let depth=Math.max(0,Math.min(1,(1-af/100)+back*.55-lean*.28));
  const br=Math.sin(ph)*(act==='speak'?1:.42);
  const talk=act==='speak'?Math.sin(ph*7.3)*.5+Math.sin(ph*11.7)*.25:0;
  cx.clearRect(0,0,W,H);
  const bg=cx.createRadialGradient(W/2,H*.62,0,W/2,H*.62,Math.max(W,H)*.8);
  bg.addColorStop(0,'#191512');bg.addColorStop(1,'#070605');
  cx.fillStyle=bg;cx.fillRect(0,0,W,H);
  const gh=rp<18?3:rp<35?2:1;
  for(let i=gh-1;i>=0;i--){
    const o=i*(rp<18?1:.6);
    figure(depth+i*.06,i===0?1:.34,(depth*5.5+i*3.2)*(rp<35?1.5:1),
      Math.sin(ph*.6+i*2.1)*o*7,(br+talk)*3+i*2,tilt*(i===0?1:-.6),1+lean*.05);
  }
  const n=Math.ceil(W/GAP)+1;
  for(let i=0;i<n;i++){
    const x=i*GAP-(GAP-BARW)/2;
    const g=cx.createLinearGradient(x,0,x+BARW,0);
    g.addColorStop(0,'#2b241d');g.addColorStop(.22,'#443a2e');
    g.addColorStop(.55,'#241e18');g.addColorStop(1,'#0e0b09');
    cx.fillStyle=g;cx.fillRect(x,0,BARW,H);
    cx.fillStyle='rgba(255,240,214,.05)';cx.fillRect(x,0,1,H);
  }
  cx.fillStyle='#171310';cx.fillRect(0,H*.972,W,H*.028);
  if(glow>.01){
    const y=H*(.30+.10*Math.sin(ph*2));
    const g=cx.createLinearGradient(0,y-40,0,y+40);
    g.addColorStop(0,'rgba(232,214,176,0)');
    g.addColorStop(.5,'rgba(232,214,176,'+(.22*glow).toFixed(3)+')');
    g.addColorStop(1,'rgba(232,214,176,0)');
    cx.fillStyle=g;cx.fillRect(0,y-40,W,80);
  }
  const v=cx.createRadialGradient(W/2,H*.5,Math.min(W,H)*.3,W/2,H*.5,Math.max(W,H)*.75);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.72)');
  cx.fillStyle=v;cx.fillRect(0,0,W,H);
  requestAnimationFrame(draw);
}

/* ================== 文本渲染 ================== */
function rates(){return dreadLv===2?{d:.26,l:.07,r:.12}:dreadLv===1?{d:.10,l:0,r:0}:{d:0,l:0,r:0};}
function corrupt(s,r){if(r<=0)return s;let o='';
  for(const ch of s)o+=(ch.trim()&&Math.random()<r)?NOISE[Math.random()*NOISE.length|0]:ch;return o;}
function regInner(r){
  const isLit=lit===r.id,R=rates(),tR=isLit?R.l:R.d,kR=isLit?0:R.d;
  return r.p.map(x=>x[0]==='t'?corrupt(x[1],tR)
    :'<span class="tok t'+x[2]+(taken[x[1]]?' used':'')+'" data-k="'+x[1]+'">'+corrupt(x[3],kR)+'</span>').join('');
}
function paint(){
  ALL().forEach(r=>{
    const el=document.querySelector('.line[data-r="'+r.id+'"]');
    if(!el)return;
    if(gone[r.id]){el.className='line gone'+(el.dataset.gift?' gift':'');el.textContent='…………';return;}
    el.className='line'+(lit===r.id?' lit':read[r.id]?' done':' done')+(el.dataset.gift?' gift':'');
    el.innerHTML=regInner(r);
  });
}
function scrim(){
  const w=$('textWrap'),l=$('lines');
  const h=l.getBoundingClientRect().bottom-w.getBoundingClientRect().top;
  $('scrim').style.height=Math.max(0,Math.min(H,h+70))+'px';
}
function toBottom(){$('textWrap').scrollTop=$('textWrap').scrollHeight;}

/* ================== 阶段一：倾听 ================== */
function addLine(reg,gift){
  const d=document.createElement('div');
  d.className='line now'+(gift?' gift':'');
  d.dataset.r=reg.id;if(gift)d.dataset.gift='1';
  $('lines').appendChild(d);
  return d;
}
function typeLine(reg,gift,after){
  document.querySelectorAll('.line.now').forEach(e=>{e.classList.remove('now');e.classList.add('done');});
  curEl=addLine(reg,gift);curReg=reg;fullTxt=plain(reg);
  typing=true;act='speak';$('tip').classList.add('off');
  let i=0;clearInterval(tm);
  tm=setInterval(()=>{
    curEl.textContent=fullTxt.slice(0,++i);
    if(i%3===0){scrim();toBottom();}
    if(i>=fullTxt.length)doneLine(after);
  },fast?TYPE_FAST:TYPE_SLOW);
}
function doneLine(after){
  clearInterval(tm);typing=false;act='idle';
  curEl.textContent=fullTxt;curEl.innerHTML=regInner(curReg);
  scrim();toBottom();
  if(after){after();return;}
  if(phase==='listen'){
    $('tip').classList.remove('off');
    $('tip').textContent=idx>=REGIONS.length?'▼ 他说完了':'▼ 听下去';
    if(fast&&idx<REGIONS.length)setTimeout(nextLine,180);
  }
}
function nextLine(){
  if(idx>=REGIONS.length){toParse();return;}
  typeLine(REGIONS[idx++],false);
}
function toParse(){
  phase='parse';document.body.classList.add('parse');
  $('tip').classList.add('off');$('ff').classList.add('hide');
  document.querySelectorAll('.line').forEach(e=>{e.classList.remove('now');e.classList.add('done');});
  $('deck').classList.add('on');
  cap('他说完了。这些话现在留在你这里——照亮一句，把成分取出来。');
  setTimeout(()=>{resize();scrim();},520);
  buildWheels();renderHud();
}
function cap(t){$('cap').textContent=t;$('cap').classList.add('on');
  clearTimeout(cap._t);cap._t=setTimeout(()=>$('cap').classList.remove('on'),4600);}

$('ff').onclick=e=>{
  e.stopPropagation();fast=!fast;
  $('ff').classList.toggle('on',fast);
  $('ff').textContent=fast?'快进 ▪▪':'快进 ▸▸';
  if(fast&&phase==='listen'&&!typing)nextLine();
};

/* ================== 点击分派 ================== */
let last=0;
document.addEventListener('pointerup',e=>{
  const t=e.target;if(!t||!t.closest)return;
  if(t.closest('#deck')||t.closest('#hud')||t.closest('#ff')||t.closest('#fin'))return;
  if(t.closest('#reply')){closeReply();return;}
  const n=Date.now();if(n-last<200)return;last=n;
  if(busy||done)return;
  if(phase==='listen'){
    if(typing){clearInterval(tm);curEl.textContent=fullTxt;doneLine();}
    else nextLine();
    return;
  }
  /* 解析阶段 */
  const tk=t.closest('.tok');
  if(tk&&lit===tk.closest('.line').dataset.r){
    const k=tk.dataset.k;
    if(!taken[k]){taken[k]=1;sel[TOK[k].t-1]=k;paint();buildWheels();
      if(FLIP[k]&&!metFlip){metFlip=true;cap('从他嘴里取来的「'+TOK[k].w+'」，还回去就成了「'+FLIP[k]+'」。');}}
    return;
  }
  const ln=t.closest('.line');
  if(!ln)return;
  const id=ln.dataset.r;
  if(lit===id||gone[id])return;
  const first=!read[id],cost=first?RP.light:RP.relight;
  if(rp<cost){cap('读不动了。');return;}
  spend(cost);lit=id;read[id]=1;act='read';paint();
  const el=document.querySelector('.line[data-r="'+id+'"]');
  if(el){el.classList.add('sweep');setTimeout(()=>el.classList.remove('sweep'),720);}
  renderHud();
  if(first&&!ln.querySelector('.tok'))cap('这一句里没有可提取的成分。');
  if(rp<=0)setTimeout(()=>finish('dry'),400);
});

/* ================== 滚轮 ================== */
const ITEM=32;
function buildWheels(){
  [1,2,3].forEach((t,i)=>{
    const box=document.querySelector('.wScroll[data-t="'+t+'"]');
    const items=[''].concat(Object.keys(taken).filter(k=>TOK[k].t===t));
    box.dataset.items=items.join(',');
    box.innerHTML='<div class="wPad"></div>'+items.map(k=>
      '<div class="wItem'+(k?'':' empty')+'">'+(k?shown(k):'—')+'</div>').join('')+'<div class="wPad"></div>';
    let j=items.indexOf(sel[i]);if(j<0){j=0;sel[i]='';}
    box.scrollTop=j*ITEM;mark(box,j);
  });
  updateBtns();
}
function mark(b,j){b.querySelectorAll('.wItem').forEach((e,n)=>e.classList.toggle('sel',n===j));}
[1,2,3].forEach((t,i)=>{
  const box=document.querySelector('.wScroll[data-t="'+t+'"]');
  box.addEventListener('scroll',()=>{clearTimeout(box._t);
    box._t=setTimeout(()=>{const it=(box.dataset.items||'').split(',');
      let j=Math.max(0,Math.min(it.length-1,Math.round(box.scrollTop/ITEM)));
      sel[i]=it[j];mark(box,j);updateBtns();},90);});
});
function okSel(){return !!(sel[0]&&sel[1]);}
function updateBtns(){
  const key=sel.join('|'),k=okSel();
  const sd=usedSay[key],ad=usedAsk[key];
  $('sayBtn').classList.toggle('ready',k&&!sd);
  $('askBtn').classList.toggle('ready',k&&!ad&&rp>=RP.ask);
  $('sayBtn').querySelector('small').textContent=sd?'说过了':'不费力气';
  $('askBtn').querySelector('small').textContent=ad?'问过了':'阅读力 −'+RP.ask;
}

/* ================== 两个动作 ================== */
$('sayBtn').onclick=e=>{
  e.stopPropagation();
  if(busy||done||!okSel())return;
  const key=sel.join('|');
  let h;
  if(usedSay[key]){
    h={af:0,txt:AGAIN_SAY[againI++%AGAIN_SAY.length],again:true};
  }else if(SAY[key]){
    h=SAY[key];usedSay[key]=1;
  }else if(SAY_ANY[sel[1]]&&!usedPred[sel[1]]){
    h=SAY_ANY[sel[1]];usedPred[sel[1]]=1;usedSay[key]=1;
  }else{
    h={af:0,txt:'嗯。我是这么说的。\n还有别的吗，神父大人。'};usedSay[key]=1;
  }
  says++;gainAf(h.af||0);act='say';updateBtns();
  hush(Object.assign({kind:'say'},h),h.again?620:820);
};
$('askBtn').onclick=e=>{
  e.stopPropagation();
  if(busy||done||!okSel())return;
  const key=sel.join('|');
  if(usedAsk[key]){
    act='idle';
    hush({kind:'again',again:true,txt:AGAIN_ASK[againI++%AGAIN_ASK.length]},620);
    return;
  }
  if(rp<RP.ask){cap('已经没有力气开口了。');return;}
  const cur=[sel[0]||null,sel[1]||null,sel[2]||null];
  let hit=ASK.find(c=>c.k.every((v,i)=>v===null?cur[i]===null:cur[i]===v));
  if(!hit){
    let bn=-1,wrong=[];
    ASK.forEach(c=>{let n=0,w=[];
      c.k.forEach((v,i)=>{(v===cur[i])?n++:w.push(i);});
      if(n>bn){bn=n;wrong=w;}});
    hit=bn===2?Object.assign({kind:'near'},wrong[0]===2?NEAR.obj:wrong[0]===0?NEAR.subj:NEAR.pred)
              :Object.assign({kind:'miss'},MISS);
  }
  usedAsk[key]=1;
  spend(RP.ask);
  if(hit.kind==='true')gotTrue=true;
  if(hit.kind==='egg')eggs++;
  gain(hit.rp||0);gainAf(hit.af||0);
  act=(hit.kind==='true'||hit.kind==='break')?'hit':hit.kind==='near'?'dodge':'ask';
  renderHud();updateBtns();hush(hit,1250);
};

function hush(h,ms){
  busy=true;$('hush').classList.add('on');
  setTimeout(()=>{$('hush').classList.remove('on');reply(h);},ms);
}
function reply(h){
  const R=rates();
  $('rTxt').innerHTML=h.txt.split('\n').map(l=>corrupt(l,R.r)).join('<br>');
  let p;
  if(h.again)p=['说过的话，不会再有第二次反应'];
  else{
    p=[h.kind==='say'?'复述':'提问 −'+RP.ask];
    if(h.rp)p.push('阅读力 ＋'+h.rp);
    if(h.af)p.push('好感 '+(h.af>0?'＋':'－')+Math.abs(h.af));
    p.push('余 '+rp);
  }
  $('rMeta').textContent=p.join('　／　');
  $('reply').classList.toggle('warm',h.kind==='say'||(h.af||0)>0);
  $('reply').classList.add('on');
}
function closeReply(){
  if(!$('reply').classList.contains('on'))return;
  $('reply').classList.remove('on');busy=false;act='idle';
  if(rp<=0)setTimeout(()=>finish('dry'),380);
  else if(gotTrue)setTimeout(()=>finish('true'),380);
}

/* ================== 数值 ================== */
function spend(n){rp=Math.max(0,rp-n);afterRp();}
function gain(n){if(n>0){rp=Math.min(RP.max,rp+n);afterRp();}}
function gainAf(n){
  af=Math.max(0,Math.min(AF.max,af+n));renderHud();
  if(af>=AF.gift1&&!g1){g1=true;gift(GIFT1[0]);}
  else if(af>=AF.gift2&&!g2){g2=true;gift(GIFT2[0]);}
  if(af<AF.floor&&!retracted)retract();
}
function gift(reg){
  setTimeout(()=>{
    typeLine(reg,true,()=>{paint();buildWheels();
      cap(reg.id==='f1'?'他压低了声音。这一段不是说给记录听的。':'他往前挪了挪。还有话要说。');});
  },600);
}
function afterRp(){
  const lv=rp<18?2:rp<35?1:0;
  if(lv!==dreadLv){const up=lv>dreadLv;dreadLv=lv;paint();
    if(up&&lv===1)cap('字开始站不住了。');
    if(up&&lv===2)cap('你已经读不进去了。他还在说。');}
  renderHud();
}
function retract(){
  retracted=true;
  const c=ALL().filter(r=>read[r.id]&&r.id!==lit&&!gone[r.id]&&r.p.some(x=>x[0]==='k'));
  if(!c.length)return;
  const r=c[c.length-1];gone[r.id]=1;
  r.p.forEach(x=>{if(x[0]==='k'&&!sel.includes(x[1]))delete taken[x[1]];});
  act='retract';paint();buildWheels();cap('他把刚才那句话收了回去。');
}
function renderHud(){
  $('rpFill').style.width=Math.max(0,Math.min(100,rp/RP.max*100))+'%';
  $('rpNum').textContent=rp;
  $('hrect').setAttribute('y',(29-(af/AF.max)*29).toFixed(2));
  $('afNum').textContent=af;
  $('heartBox').classList.toggle('full',af>=AF.gift2);
  updateBtns();
}
function finish(why){
  if(done)return;done=true;
  let s,d;
  if(why==='true'){s='他说了「我们」。';
    d='那天晚上出去的不是一个。\n有一部分在食堂吃饭，有一部分在外面。\n\n可报告上「主犯」一栏，只填得下一个名字。';}
  else{s='你听不懂他在说什么了。';
    d='阅读力耗尽。他的话还在继续，\n但那已经不是你能进入的东西了。';}
  d+='\n\n────────\n好感 '+af+'　／　余下阅读力 '+rp+'\n复述 '+says+' 次　彩蛋 '+eggs;
  $('finS').textContent=s;$('finD').textContent=d;$('fin').classList.add('on');
}
$('again').onclick=e=>{e.stopPropagation();location.reload();};

renderHud();resize();requestAnimationFrame(draw);
setTimeout(nextLine,600);
</script>

<script>
(function(){
  var q=new URLSearchParams(location.search),r=q.get('ret')||'game-zh';
  if(!/^[a-z-]{2,20}$/.test(r))r='game-zh';
  var L=/-zh$/.test(r)?'返回作品集':/-en$/.test(r)?'Back to the portfolio':'Retour au portfolio';
  document.querySelectorAll('a.exit').forEach(function(a){a.href='../../index.html#'+r;a.target='_top';
    if(a.classList.contains('finExit'))a.textContent=L;else a.title=L;});
  document.querySelectorAll('a.next').forEach(function(a){a.href=a.getAttribute('data-next')+'?ret='+encodeURIComponent(r);});
})();
</script>
